apiVersion: v1
kind: ServiceAccount
metadata: {name: zuri-backend}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: zuri-frontend}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: zuri-config-reader}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: zuri-config-reader-binding}
subjects:
  - {kind: ServiceAccount, name: zuri-backend}
  - {kind: ServiceAccount, name: zuri-frontend}
roleRef:
  kind: Role
  name: zuri-config-reader
  apiGroup: rbac.authorization.k8s.io
